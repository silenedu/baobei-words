<!DOCTYPE html>
<html lang="zh-CN" data-ui="phone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#EAFBFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">

</head>
<body>

<div class="blobs"><i></i><i></i><i></i></div>

<div class="app" id="app">

  <!-- 导航（手机：底部；Pad：最左侧） -->
  <nav class="nav" id="nav">
    <div class="nav-brand">
      <div class="brand-badge">🔤</div>
      <div class="brand-txt"><b>背单词小助手</b><span>自然拼读 · 牛津自拼 2-5 级</span></div>
    </div>
    <div class="nav-items">
      <button class="nav-btn" data-tab="dash"><span class="ni">📊</span><span class="nt">数据面板</span></button>
      <button class="nav-btn" data-tab="learn"><span class="ni">📚</span><span class="nt">今日学习</span></button>
      <button class="nav-btn" data-tab="match"><span class="ni">🧩</span><span class="nt">配对游戏</span></button>
      <button class="nav-btn" data-tab="wrong"><span class="ni">💡</span><span class="nt">错题本</span><span class="nbadge" id="navWrong">0</span></button>
      <button class="nav-btn" data-tab="set"><span class="ni">⚙️</span><span class="nt">设置</span></button>
    </div>
  </nav>

  <main class="main">
    <header class="topbar">
      <div class="hello">
        <div class="hi">嗨，<span id="babyName">宝贝</span>！<em id="helloEmoji">👋</em></div>
        <div class="sub" id="todayLabel"></div>
      </div>
      <div class="ui-switch" id="uiSwitch" title="预览模式">
        <button data-ui="auto">自动</button>
        <button data-ui="phone">手机</button>
        <button data-ui="pad">Pad</button>
      </div>
    </header>

    <section id="v-dash" class="view"></section>
    <section id="v-learn" class="view"></section>
    <section id="v-match" class="view"></section>
    <section id="v-wrong" class="view"></section>
    <section id="v-set" class="view"></section>
  </main>
</div>

<!-- 弹层 -->
<div class="modal" id="modal" hidden>
  <div class="modal-bg" data-close="1"></div>
  <div class="modal-panel">
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <button class="icon-btn" data-close="1" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="celebrate" id="celebrate" hidden></div>
<div class="confetti" id="confetti" hidden></div>

<div class="version-tag" id="versionTag">v1</div>

<script src="js/data-l23.js"></script>
<script src="js/data-l45.js"></script>
<script src="js/data.js"></script>
<script>window.__SW_VER = "v1";</script>
<script src="js/app.js"></script>

<script>
/* SW 注册器放在「网络优先」的 HTML 里，避免 cache-first 死锁 */
(function () {
  var SW_VER = window.__SW_VER || "v1";
  if (!("serviceWorker" in navigator)) return;
  addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js?v=" + SW_VER).then(function (reg) {
      try { reg.update(); } catch (e) {}
    }).catch(function () {});
  });
  var reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
})();
</script>
</body>
</html>
